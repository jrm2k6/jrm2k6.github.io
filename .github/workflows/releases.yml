name: Refresh releases

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/fetch_releases.rb
        env:
          # Fine-grained PAT with Contents: read on every repo in _data/release_repos.yml
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/releases.json; then
            echo "No new tags."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/releases.json
          git commit -m "update: refresh releases"
          git push
