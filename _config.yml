# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jeremy Dagorn - Software Engineer and Crêpe Maker.
email: jeremy.dagorn@gmail.com
description: > # Learn everything, everywhere, all the time
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jeremydagorn.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jrm2k6
github_username:  jrm2k6

google_analytics: UA-48045020-1

# Build settings
markdown: kramdown
theme: minima
highlighter: rouge
plugins:
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  - worker
  - node_modules
  - AGENTS.md
  - cert.pem

# Animated weather backdrop (assets/js/weather-backdrop.js).
# endpoint: the Cloudflare Worker's GET /location URL (see worker/README.md).
# fallback: used when no endpoint is set or the Worker can't be reached.
weather_backdrop:
  enabled: true
  endpoint: "https://jeremydagorn-location-api.jeremy-dagorn.workers.dev/location"
  fallback:
    city: Buffalo, NY
    name: Buffalo
    country_code: US
    lat: 42.8864
    lon: -78.8784
    scene: buffalo

header_pages:
  - about.md
  - projects.md
  - food-challenge.md

defaults:
  - scope:
      path: "assets/img"
    values:
      image: true
